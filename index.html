<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Математика Евы — 3 класс</title>
<style>
:root{
  --bg:#f2f2f7;
  --card:rgba(255,255,255,.88);
  --text:#1d1d1f;
  --muted:#86868b;
  --blue:#007aff;
  --green:#34c759;
  --red:#ff3b30;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{
  min-height:100vh;
  padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);
  background:
    radial-gradient(circle at 10% 0%, rgba(0,122,255,.14), transparent 30%),
    radial-gradient(circle at 95% 100%, rgba(175,82,222,.11), transparent 32%),
    linear-gradient(180deg,#f7f7fa 0%,#eef2f8 100%);
}
.screen{
  width:100%;
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:28px 0;
}
.hidden{display:none!important}

.glass{
  background:var(--card);
  -webkit-backdrop-filter:blur(24px);
  backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.78);
  box-shadow:0 20px 60px rgba(0,0,0,.10);
}

.start-card{
  border-radius:32px;
  padding:34px 26px;
  text-align:center;
}
.logo{
  width:88px;height:88px;border-radius:26px;
  margin:0 auto 20px;
  display:flex;align-items:center;justify-content:center;
  font-size:42px;
  background:linear-gradient(145deg,#0a84ff,#5ac8fa);
  box-shadow:0 14px 30px rgba(0,122,255,.28);
}
.start-card h1{font-size:36px;line-height:1.05;margin:0 0 10px;letter-spacing:-1.4px}
.start-card p{margin:0 auto 28px;max-width:340px;color:var(--muted);font-size:16px;line-height:1.5}
.primary{
  width:100%;border:none;border-radius:19px;padding:17px 20px;
  font-size:18px;font-weight:800;color:#fff;background:var(--blue);
  cursor:pointer;box-shadow:0 10px 24px rgba(0,122,255,.25);
  transition:transform .15s ease,opacity .15s ease;
}
.primary:active,.cashout:active,.answer:active{transform:scale(.98)}

.game{justify-content:flex-start;padding-top:26px}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;gap:12px;
}
.titlebox .eyebrow{font-size:13px;color:var(--muted);margin-bottom:3px}
.titlebox h2{font-size:27px;margin:0;letter-spacing:-.7px}
.balance-card{
  min-width:130px;border-radius:22px;padding:12px 16px;text-align:right;
}
.balance-card small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
#balance{font-size:28px;font-weight:900;letter-spacing:-.6px}

.progress{
  height:8px;background:rgba(120,120,128,.12);border-radius:999px;
  overflow:hidden;margin-bottom:16px;
}
.progress > div{height:100%;width:0;background:var(--blue);border-radius:999px;transition:width .35s ease}

.quiz-card{border-radius:30px;padding:26px 20px 22px}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 11px;border-radius:999px;background:#e8f2ff;color:var(--blue);
  font-size:12px;font-weight:800;
}
.prompt{text-align:center;color:var(--muted);font-size:14px;margin:26px 0 8px}
#question{
  text-align:center;font-size:48px;font-weight:900;letter-spacing:-1.6px;
  margin:0 0 26px;
}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer{
  border:none;border-radius:20px;background:#f2f2f7;color:var(--text);
  padding:19px 10px;font-size:22px;font-weight:850;cursor:pointer;
  transition:transform .15s ease,background .2s ease,color .2s ease;
}
.answer:hover{background:#e9e9ee}
.answer.correct{background:var(--green);color:#fff;animation:pop .28s ease}
.answer.wrong{background:var(--red);color:#fff;animation:shake .3s ease}
.answer.dim{opacity:.48}
#message{min-height:26px;text-align:center;margin-top:18px;font-size:15px;font-weight:800}
.good{color:#248a3d}.bad{color:#d70015}

.stats{
  display:flex;justify-content:center;gap:26px;
  margin-top:14px;color:var(--muted);font-size:13px
}
.stats b{color:var(--text)}

.cashout{
  width:100%;margin-top:16px;border:none;border-radius:20px;padding:17px;
  background:#1d1d1f;color:#fff;font-size:17px;font-weight:850;cursor:pointer;
  box-shadow:0 10px 24px rgba(0,0,0,.14);
}

.final-card{border-radius:32px;padding:34px 24px;text-align:center}
.final-icon{
  width:92px;height:92px;border-radius:28px;margin:0 auto 20px;
  background:linear-gradient(145deg,#34c759,#8ee69d);
  display:flex;align-items:center;justify-content:center;font-size:46px;
  box-shadow:0 14px 30px rgba(52,199,89,.25)
}
.final-card .small{font-size:17px;color:var(--muted);font-weight:700;margin-bottom:8px}
#finalMoney{font-size:54px;font-weight:950;letter-spacing:-2px;margin-bottom:10px}
.final-card h3{margin:0 0 26px;font-size:27px;letter-spacing:-.8px}
.secondary{
  width:100%;border:none;border-radius:19px;padding:16px 20px;
  font-size:17px;font-weight:800;background:#f2f2f7;color:var(--text);cursor:pointer
}

.coin-float{
  position:fixed;left:50%;top:35%;transform:translate(-50%,-50%);
  font-size:48px;pointer-events:none;opacity:0;z-index:20;
}
.coin-float.show{animation:coinFly .7s ease forwards}

@keyframes pop{
  0%{transform:scale(.96)}
  60%{transform:scale(1.05)}
  100%{transform:scale(1)}
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}
@keyframes coinFly{
  0%{opacity:0;transform:translate(-50%,20px) scale(.8)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-80px) scale(1.15)}
}

@media(max-width:480px){
  .screen{padding-top:22px}
  #question{font-size:42px}
  .answer{font-size:20px;padding:18px 8px}
  .balance-card{min-width:118px}
}
</style>
</head>
<body>

<div class="coin-float" id="coinFloat">🪙</div>

<section id="startScreen" class="screen">
  <div class="start-card glass">
    <div class="logo">➗</div>
    <h1>Математика Евы</h1>
    <p>Решай примеры за 3 класс. За правильный ответ получай +2 ₽, за ошибку — −2 ₽.</p>
    <button class="primary" onclick="startGame()">Начать игру</button>
  </div>
</section>

<section id="gameScreen" class="screen game hidden">
  <div class="topbar">
    <div class="titlebox">
      <div class="eyebrow">Тренажёр • 3 класс</div>
      <h2>Математика</h2>
    </div>

    <div class="balance-card glass">
      <small>Баланс</small>
      <div id="balance">0 ₽</div>
    </div>
  </div>

  <div class="progress"><div id="progressBar"></div></div>

  <div class="quiz-card glass">
    <div class="badge">✦ Новый пример</div>
    <div class="prompt">Выбери правильный ответ</div>
    <div id="question">7 × 8 = ?</div>

    <div class="answers" id="answers">
      <button class="answer">48</button>
      <button class="answer">56</button>
      <button class="answer">54</button>
      <button class="answer">64</button>
    </div>

    <div id="message"></div>

    <div class="stats">
      <span>Верно: <b id="correctCount">0</b></span>
      <span>Ошибок: <b id="wrongCount">0</b></span>
    </div>
  </div>

  <button class="cashout" onclick="cashOut()">Забрать деньги</button>
</section>

<section id="finalScreen" class="screen hidden">
  <div class="final-card glass">
    <div class="final-icon">💰</div>
    <div class="small">Ева заработала</div>
    <div id="finalMoney">0 ₽</div>
    <h3>Отличная работа!</h3>
    <button class="primary" onclick="startGame()">Играть ещё</button>
    <button class="secondary" style="margin-top:10px" onclick="showStart()">На главный экран</button>
  </div>
</section>

<script>
var balance=0;
var correctAnswer=56;
var correctCount=0;
var wrongCount=0;
var locked=false;
var answered=0;
var totalForProgress=10;

function rnd(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=arr[i]; arr[i]=arr[j]; arr[j]=t;
  }
  return arr;
}

function showOnly(id){
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("finalScreen").classList.add("hidden");
  document.getElementById(id).classList.remove("hidden");
}

function showStart(){
  showOnly("startScreen");
}

function startGame(){
  balance=0;
  correctCount=0;
  wrongCount=0;
  answered=0;
  locked=false;
  document.getElementById("balance").textContent="0 ₽";
  document.getElementById("correctCount").textContent="0";
  document.getElementById("wrongCount").textContent="0";
  document.getElementById("progressBar").style.width="0%";
  showOnly("gameScreen");
  generateQuestion();
}

function generateQuestion(){
  locked=false;
  var msg=document.getElementById("message");
  msg.textContent="";
  msg.className="";

  var type=rnd(1,4);
  var a,b,s;

  if(type===1){
    a=rnd(10,100); b=rnd(1,100);
    correctAnswer=a+b; s="+";
  }else if(type===2){
    a=rnd(20,150); b=rnd(1,a);
    correctAnswer=a-b; s="−";
  }else if(type===3){
    a=rnd(2,10); b=rnd(2,10);
    correctAnswer=a*b; s="×";
  }else{
    b=rnd(2,10); correctAnswer=rnd(2,10);
    a=b*correctAnswer; s="÷";
  }

  document.getElementById("question").textContent=a+" "+s+" "+b+" = ?";

  var variants=[correctAnswer];
  while(variants.length<4){
    var diff=rnd(-10,10);
    if(diff===0) continue;
    var wrong=correctAnswer+diff;
    if(wrong>=0 && variants.indexOf(wrong)===-1) variants.push(wrong);
  }

  shuffle(variants);
  var box=document.getElementById("answers");
  box.innerHTML="";

  for(var i=0;i<variants.length;i++){
    var btn=document.createElement("button");
    btn.className="answer";
    btn.textContent=variants[i];

    (function(value,button){
      button.onclick=function(){checkAnswer(value,button)};
    })(variants[i],btn);

    box.appendChild(btn);
  }
}

function checkAnswer(value,button){
  if(locked) return;
  locked=true;
  answered++;

  var buttons=document.getElementsByClassName("answer");
  var msg=document.getElementById("message");

  if(value===correctAnswer){
    balance+=2;
    correctCount++;
    button.classList.add("correct");
    msg.textContent="Верно! +2 ₽";
    msg.className="good";
    playCoinSound();
    animateCoin();
  }else{
    balance-=2;
    wrongCount++;
    button.classList.add("wrong");
    msg.textContent="Неверно! −2 ₽";
    msg.className="bad";

    for(var i=0;i<buttons.length;i++){
      if(Number(buttons[i].textContent)===correctAnswer){
        buttons[i].classList.add("correct");
      }else if(buttons[i]!==button){
        buttons[i].classList.add("dim");
      }
    }
  }

  document.getElementById("balance").textContent=balance+" ₽";
  document.getElementById("correctCount").textContent=correctCount;
  document.getElementById("wrongCount").textContent=wrongCount;

  var progress=Math.min(100,(answered%totalForProgress)/totalForProgress*100);
  document.getElementById("progressBar").style.width=progress+"%";

  setTimeout(generateQuestion,950);
}

function cashOut(){
  document.getElementById("finalMoney").textContent=balance+" ₽";
  showOnly("finalScreen");
}

function animateCoin(){
  var coin=document.getElementById("coinFloat");
  coin.classList.remove("show");
  void coin.offsetWidth;
  coin.classList.add("show");
}

function playCoinSound(){
  try{
    var AudioCtx=window.AudioContext||window.webkitAudioContext;
    var ctx=new AudioCtx();

    function tone(freq,start,duration,volume){
      var osc=ctx.createOscillator();
      var gain=ctx.createGain();
      osc.type="sine";
      osc.frequency.value=freq;
      gain.gain.setValueAtTime(volume,ctx.currentTime+start);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+start+duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime+start);
      osc.stop(ctx.currentTime+start+duration);
    }

    tone(880,0,.12,.18);
    tone(1320,.08,.16,.14);

    setTimeout(function(){ctx.close()},350);
  }catch(e){}
}
</script>
</body>
</html>
